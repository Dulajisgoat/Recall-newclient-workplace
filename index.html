<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-light: #f0f2f5;
    --glass-border: rgba(255, 255, 255, 0.4);
    --glass-highlight: rgba(255, 255, 255, 0.9);
    
    --glass-blur-heavy: 40px;
    --glass-inner-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8), inset 0 -1px 1px rgba(168, 44, 69, 0.1);
    --glass-drop-shadow: 0 12px 40px rgba(168, 44, 69, 0.12), 0 2px 8px rgba(168, 44, 69, 0.05);
    
    --red-deep: #C41E3A;
    --red-bright: #FF2400;
    --red-glow: rgba(255, 36, 0, 0.4);
    
    --text-red: #C41E3A;
    --text-dark-red: #8B0000;
    --text-white: #FFFFFF;
    --text-muted: #7a7a7a;
  }

  * { 
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Manrope', -apple-system, 'Segoe UI', Helvetica, sans-serif;
    font-size: 11pt;
    line-height: 1.65;
    color: var(--text-red);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg-light);
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* Liquid Glass Background Elements */
  .glass-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    background: 
      radial-gradient(circle at 10% 10%, rgba(255, 36, 0, 0.05) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(196, 30, 58, 0.08) 0%, transparent 45%),
      #f0f2f5;
    overflow: hidden;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    z-index: -1;
    opacity: 0.3;
    animation: floatOrb 20s infinite ease-in-out;
  }

  .orb-1 { width: 400px; height: 400px; background: var(--red-deep); top: -100px; left: -100px; }
  .orb-2 { width: 300px; height: 300px; background: var(--red-bright); bottom: -50px; right: -50px; animation-delay: -5s; }
  .orb-3 { width: 200px; height: 200px; background: #FF6B6B; top: 40%; left: 40%; animation-delay: -10s; }

  /* Auth Card (Apple Liquid Glass Interface) */
  .auth-card {
    background: rgba(255, 255, 255, 0.25); /* Translucent so the orb is visible underneath */
    backdrop-filter: blur(var(--glass-blur-heavy)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur-heavy)) saturate(180%);
    /* SVG displacement filter added inline in HTML for that liquid refraction look */
    border: 1px solid var(--glass-border);
    border-radius: 32px;
    padding: 48px 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: var(--glass-drop-shadow), var(--glass-inner-shadow);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  .auth-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
    z-index: 2;
  }

  .auth-card::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.3) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .auth-content {
    position: relative;
    z-index: 1;
  }

  /* Logo */
  .logo {
    width: 72px;
    height: 72px;
    background: #FFFFFF;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px;
    font-weight: 600;
    color: var(--red-deep);
    box-shadow: 0 8px 24px rgba(196, 30, 58, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    position: relative;
    overflow: hidden;
    letter-spacing: -0.04em;
  }

  .logo::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
    pointer-events: none;
  }

  /* Typography */
  .auth-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--text-dark-red);
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .auth-subtitle {
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    color: var(--text-red);
    text-align: center;
    margin-bottom: 32px;
    opacity: 0.8;
  }

  /* Toggle */
  .auth-toggle {
    display: flex;
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 4px;
    margin-bottom: 32px;
    position: relative;
    border: 1px solid var(--glass-border);
  }

  .toggle-btn {
    flex: 1;
    padding: 10px 16px;
    background: transparent;
    border: none;
    border-radius: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-red);
    cursor: pointer;
    transition: color 0.3s ease;
    position: relative;
    z-index: 1;
    letter-spacing: 0.02em;
  }

  .toggle-btn.active {
    color: var(--text-white);
  }

  .toggle-slider {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    background: linear-gradient(135deg, var(--red-deep) 0%, var(--red-bright) 100%);
    border-radius: 12px;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    box-shadow: 0 4px 12px rgba(196, 30, 58, 0.3);
  }

  .toggle-slider.right {
    transform: translateX(100%);
  }

  /* Form */
  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .input-group {
    position: relative;
  }

  .input-field {
    width: 100%;
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    color: var(--text-dark-red);
    outline: none;
    transition: all 0.3s ease;
  }

  .input-field:focus {
    background: rgba(255, 255, 255, 0.6);
    border-color: var(--red-bright);
    box-shadow: 0 0 0 4px rgba(255, 36, 0, 0.1);
  }

  .input-field::placeholder {
    color: var(--text-muted);
    font-weight: 400;
  }

  /* Submit Button */
  .submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--red-deep) 0%, var(--red-bright) 100%);
    border: none;
    border-radius: 14px;
    color: var(--text-white);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(196, 20, 58, 0.3);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(196, 20, 58, 0.4);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .submit-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
    pointer-events: none;
  }

  /* Secondary Action */
  .secondary-action {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-red);
  }

  .secondary-action button {
    background: none;
    border: none;
    color: var(--red-bright);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    font-size: 13px;
    transition: opacity 0.3s ease;
  }

  .secondary-action button:hover {
    opacity: 0.8;
    text-decoration: underline;
  }

  /* Form State */
  .form-section {
    display: none;
  }

  .form-section.active {
    display: block;
    animation: fadeIn 0.5s ease forwards;
  }

  .hidden-field {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.5s ease, opacity 0.3s ease, margin 0.3s ease;
    margin: 0;
  }

  .hidden-field.visible {
    max-height: 80px;
    opacity: 1;
  }

  /* Auth Message Box */
  .auth-message {
    text-align: center;
    font-size: 13px;
    margin-top: 15px;
    min-height: 20px;
    font-weight: 500;
    color: var(--red-bright);
    transition: color 0.2s ease;
  }
  .auth-message.success { color: #2E7D32; }
  .auth-message.loading { color: var(--red-deep); }

  /* Footer Powered By */
  .powered-footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--glass-border);
    text-align: center;
    font-size: 12px;
    color: var(--text-red);
    opacity: 0.7;
    letter-spacing: 0.05em;
    font-family: 'Space Grotesk', sans-serif;
  }
  .powered-footer span {
    font-weight: 600;
    color: var(--text-dark-red);
  }

  /* App Container (Post-Login) */
  .app-container {
    width: 100%;
    max-width: 800px;
    margin: 40px auto;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(var(--glass-blur-heavy)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur-heavy)) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 32px;
    padding: 48px;
    box-shadow: var(--glass-drop-shadow), var(--glass-inner-shadow);
    display: none;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--glass-border);
  }
  
  .app-user-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red-deep) 0%, var(--red-bright) 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
  }

  .logout-btn {
    background: rgba(196, 30, 58, 0.1);
    border: 1px solid var(--glass-border);
    color: var(--red-deep);
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .logout-btn:hover {
    background: var(--red-deep);
    color: white;
  }

  /* Keyframe Animations */
  @keyframes fadeIn { 
    from { opacity: 0; } 
    to { opacity: 1; } 
  }
  
  @keyframes fadeUp { 
    from { opacity: 0; transform: translateY(20px); } 
    to { opacity: 1; transform: translateY(0); } 
  }
  
  @keyframes floatOrb {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(30px, 30px); }
    50% { transform: translate(-20px, 40px); }
    75% { transform: translate(20px, -30px); }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .auth-card {
      padding: 36px 24px;
    }
    .auth-title {
      font-size: 24px;
    }
  }

  /* ========================================================= */
  /* Floating "R" Orb - Moves in a specific figure-8 pattern   */
  /* ========================================================= */
  .floating-r-orb {
    position: fixed;
    top: 0;
    left: 0;
    width: 50px;
    height: 50px;
    margin-top: -25px;
    margin-left: -25px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--red-bright), var(--red-deep));
    box-shadow: 0 0 30px var(--red-glow), inset 0 2px 5px rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    z-index: 0; /* Kept at 0 so the glass card sits on top and blurs it */
    pointer-events: none;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .floating-r-orb.flash {
    background: radial-gradient(circle at 35% 35%, #66ff66, #00cc00);
    box-shadow: 0 0 60px rgba(0, 255, 0, 0.7), 0 0 100px rgba(0, 255, 0, 0.4);
  }

  /* After-image trail for the Floating "R" Orb - matches its glow/gradient */
  .r-orb-echo {
    position: fixed;
    top: 0;
    left: 0;
    width: 50px;
    height: 50px;
    margin-top: -25px;
    margin-left: -25px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--red-bright), var(--red-deep));
    box-shadow: 0 0 30px var(--red-glow);
    z-index: 0;
    pointer-events: none;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .r-orb-echo.flash {
    background: radial-gradient(circle at 35% 35%, #66ff66, #00cc00);
    box-shadow: 0 0 60px rgba(0, 255, 0, 0.7), 0 0 100px rgba(0, 255, 0, 0.4);
  }
</style>
</head>
<body>

<!-- SVG Liquid Glass Displacement Filter -->
<svg style="position: absolute; width: 0; height: 0; overflow: hidden;">
  <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="92" result="noise" />
    <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
    <feDisplacementMap in="SourceGraphic" in2="blurred" scale="70" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<div class="glass-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Floating R Orb after-image trail -->
<div class="r-orb-echo" id="rOrbEcho0" style="opacity: 0.45;"></div>
<div class="r-orb-echo" id="rOrbEcho1" style="opacity: 0.32;"></div>
<div class="r-orb-echo" id="rOrbEcho2" style="opacity: 0.20;"></div>
<div class="r-orb-echo" id="rOrbEcho3" style="opacity: 0.11;"></div>
<div class="r-orb-echo" id="rOrbEcho4" style="opacity: 0.05;"></div>

<!-- Floating R Orb -->
<div class="floating-r-orb" id="rOrb">R</div>

<!-- ===================================================================== -->
<!-- ⚠️ IMPORTANT NOTICE TO FUTURE DEVELOPERS ⚠️                            -->
<!-- The Supabase integration below is STRICTLY FOR AUTHENTICATION ONLY.   -->
<!-- It handles user Login and Registration via Edge Functions.            -->
<!-- DO NOT mistake this for a general database. All other app data        -->
<!-- functionality/features will be provided by future separate systems.   -->
<!-- ===================================================================== -->

<!-- Login / Signup UI (Applied Apple Liquid Glass Interface) -->
<div class="auth-card" id="authCard">
  <div class="auth-content">
    
    <!-- R Logo with white background -->
    <div class="logo">R</div>
    
    <h1 class="auth-title" id="formTitle">Welcome Back</h1>
    <p class="auth-subtitle" id="formSubtitle">Sign in to continue your learning</p>
    
    <!-- Toggle Switch -->
    <div class="auth-toggle">
      <div class="toggle-slider" id="toggleSlider"></div>
      <button class="toggle-btn active" id="loginBtn">Sign In</button>
      <button class="toggle-btn" id="signupBtn">Sign Up</button>
    </div>
    
    <!-- Login Form -->
    <form class="auth-form form-section active" id="loginForm">
      <div class="input-group">
        <input type="text" class="input-field" id="loginUsername" placeholder="Username" required>
      </div>
      <div class="input-group">
        <input type="password" class="input-field" id="loginPassword" placeholder="Password" required>
      </div>
      <div class="auth-message" id="loginMessage"></div>
      <button type="submit" class="submit-btn" id="loginSubmit">Sign In</button>
    </form>
    
    <!-- Sign Up Form -->
    <form class="auth-form form-section" id="signupForm">
      <div class="input-group">
        <input type="text" class="input-field" id="signupUsername" placeholder="Username" required>
      </div>
      <div class="input-group">
        <input type="password" class="input-field" id="signupPassword" placeholder="Create Password" required>
      </div>
      <div class="auth-message" id="signupMessage"></div>
      <button type="submit" class="submit-btn" id="signupSubmit">Create Account</button>
    </form>
    
    <p class="secondary-action">
      <span id="secondaryText">Don't have an account?</span>
      <button type="button" id="switchModeBtn">Sign up</button>
    </p>

    <div class="powered-footer">
      powered by <span>UniClvrPass</span>
    </div>
    
  </div>
</div>

<!-- Main App UI (Loads after Login) -->
<div class="app-container" id="appContainer">
  <div class="app-header">
    <div class="app-user-info">
      <div class="user-avatar" id="userAvatar">U</div>
      <div>
        <div style="font-weight: 600; color: var(--text-dark-red); font-family: 'Space Grotesk', sans-serif;" id="appUsername">user</div>
        <div style="font-size: 12px; color: var(--text-red); opacity: 0.8;">Recall Workspace</div>
      </div>
    </div>
    <button class="logout-btn" id="logoutBtn">Sign out</button>
  </div>
  
  <!-- Future App Functionality Goes Here -->
  <div style="text-align: center; padding: 40px 0; color: var(--text-red); opacity: 0.7;">
    <h2 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 10px;">Welcome to Recall</h2>
    <p>Your learning journey continues here. (App features to be added)</p>
  </div>
</div>

<script>
  // =====================================================================
  // ⚠️ SUPABASE AUTH CONFIGURATION ⚠️
  // This API endpoint is ONLY for user authentication (Login/Register).
  // Do not use this for fetching or saving app data. 
  // =====================================================================
  const SUPABASE_FUNCTIONS_URL = 'https://lbujqhnadkwqgojbhalw.supabase.co/functions/v1';
  
  function getApiUrl(action) {
    return (action === 'login' || action === 'register')
      ? `${SUPABASE_FUNCTIONS_URL}/auth`
      : `${SUPABASE_FUNCTIONS_URL}/manage-organizations`; // Left intact for routing consistency, but unused in this stripped UI
  }

  /* ---------- UI Element References ---------- */
  const loginBtnTab = document.getElementById('loginBtn');
  const signupBtnTab = document.getElementById('signupBtn');
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const toggleSlider = document.getElementById('toggleSlider');
  const formTitle = document.getElementById('formTitle');
  const formSubtitle = document.getElementById('formSubtitle');
  const secondaryText = document.getElementById('secondaryText');
  const switchModeBtn = document.getElementById('switchModeBtn');

  /* ---------- UI Toggle Logic ---------- */
  function switchMode(mode) {
    if (mode === 'login') {
      loginBtnTab.classList.add('active');
      signupBtnTab.classList.remove('active');
      toggleSlider.classList.remove('right');
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
      formTitle.textContent = 'Welcome Back';
      formSubtitle.textContent = 'Sign in to continue your learning';
      secondaryText.textContent = "Don't have an account?";
      switchModeBtn.textContent = 'Sign up';
    } else {
      signupBtnTab.classList.add('active');
      loginBtnTab.classList.remove('active');
      toggleSlider.classList.add('right');
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
      formTitle.textContent = 'Create Account';
      formSubtitle.textContent = 'Start your learning journey today';
      secondaryText.textContent = 'Already have an account?';
      switchModeBtn.textContent = 'Sign in';
    }
  }

  loginBtnTab.addEventListener('click', () => switchMode('login'));
  signupBtnTab.addEventListener('click', () => switchMode('signup'));
  switchModeBtn.addEventListener('click', () => {
    if (loginForm.classList.contains('active')) switchMode('signup');
    else switchMode('login');
  });

  /* ---------- Message Helper ---------- */
  function showMessage(elementId, text, type = 'error') {
    const msgEl = document.getElementById(elementId);
    msgEl.textContent = text;
    msgEl.className = `auth-message ${type}`;
  }

  /* ---------- Session Management ---------- */
  function getStoredSession() {
    try {
      const userId = localStorage.getItem('userId');
      const username = localStorage.getItem('username');
      const authToken = localStorage.getItem('authToken');
      if (userId && username && authToken) return { userId, username, authToken };
    } catch {}
    return null;
  }

  function clearSession() {
    localStorage.removeItem('userId');
    localStorage.removeItem('username');
    localStorage.removeItem('authToken');
  }

  function enterApp() {
    const session = getStoredSession();
    if (!session) return;

    document.getElementById('authCard').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
    document.getElementById('appUsername').textContent = session.username;
    document.getElementById('userAvatar').textContent = session.username.charAt(0).toUpperCase();
  }

  function showLogin() {
    document.getElementById('appContainer').style.display = 'none';
    document.getElementById('authCard').style.display = 'block';
  }

  /* ---------- Auth API Calls ---------- */
  async function authAction(action) {
    const isLogin = action === 'login';
    const username = document.getElementById(isLogin ? 'loginUsername' : 'signupUsername').value.trim();
    const password = document.getElementById(isLogin ? 'loginPassword' : 'signupPassword').value.trim();
    const messageEl = isLogin ? 'loginMessage' : 'signupMessage';
    const submitBtn = document.getElementById(isLogin ? 'loginSubmit' : 'signupSubmit');

    if (!username || !password) {
      showMessage(messageEl, 'Please enter both username and password');
      return;
    }

    showMessage(messageEl, 'Processing...', 'loading');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Loading...';

    try {
      const response = await fetch(getApiUrl(action), {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, username, password }),
      });

      const data = await response.json();

      if (!response.ok) {
        showMessage(messageEl, `HTTP ${response.status}: ${data.error || 'Server error'}`);
        return;
      }

      if (data.success) {
        showMessage(messageEl, 
          action === 'register' ? 'Account created — welcome to Recall' : 'Welcome back to Recall', 
          'success'
        );
        localStorage.setItem('userId', data.userId);
        localStorage.setItem('username', data.username);
        localStorage.setItem('authToken', data.token);
        setTimeout(() => enterApp(), 700);
      } else {
        showMessage(messageEl, data.error || 'Authentication failed');
      }
    } catch (error) {
      showMessage(messageEl, 'Error: ' + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = isLogin ? 'Sign In' : 'Create Account';
    }
  }

  loginForm.addEventListener('submit', (e) => { e.preventDefault(); authAction('login'); });
  signupForm.addEventListener('submit', (e) => { e.preventDefault(); authAction('register'); });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    clearSession();
    showLogin();
  });

  /* ---------- Boot ---------- */
  (function boot() {
    if (getStoredSession()) enterApp();
    else showLogin();
  })();

  // =====================================================================
  // Floating "R" Orb Logic
  // Moves smoothly in a specific continuous figure-8 (lemniscate) pattern.
  // Has a 1/100 chance per cycle pass to briefly flash green.
  // =====================================================================
  (function initROrb() {
    const rOrb = document.getElementById('rOrb');
    const echoes = [
      document.getElementById('rOrbEcho0'),
      document.getElementById('rOrbEcho1'),
      document.getElementById('rOrbEcho2'),
      document.getElementById('rOrbEcho3'),
      document.getElementById('rOrbEcho4')
    ];
    const echoDelaySteps = 3; // frames of gap between each echo
    const posHistory = [];
    const posHistoryMax = echoDelaySteps * echoes.length + 1;
    let time = 0;
    let speed = 0.01;
    let nextFlashChance = 0;
    let flashState = null;
    let flashStartTime = 0;
    
    function animateOrb() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const centerX = w / 2;
      const centerY = h / 2;
      
      // Specific Pattern: Figure-8 (Lemniscate of Gerono)
      // x = A * cos(t), y = B * sin(2t) / 2
      // This creates a continuous smooth "specific pattern" rotation around the center
      const radiusX = w * 0.35;
      const radiusY = h * 0.3;
      
      const x = centerX + radiusX * Math.cos(time);
      const y = centerY + radiusY * Math.sin(2 * time) / 2;
      
      // Update Orb Position
      rOrb.style.transform = `translate(${x}px, ${y}px)`;

      // Record position history and update the after-image trail
      posHistory.unshift({ x, y });
      if (posHistory.length > posHistoryMax) posHistory.length = posHistoryMax;

      echoes.forEach((echo, i) => {
        const delayIndex = (i + 1) * echoDelaySteps;
        const p = posHistory[delayIndex] || posHistory[posHistory.length - 1];
        if (p) echo.style.transform = `translate(${p.x}px, ${p.y}px)`;
      });
      
      // Check for flash chance when the orb completes a full "loop" (passing the center)
      // cos(t) is close to 0 when t is near pi/2 or 3pi/2 (the center cross of the 8)
      const cycleMod = time % Math.PI;
      if (cycleMod > Math.PI / 2 - 0.05 && cycleMod < Math.PI / 2 + 0.05 && time > nextFlashChance) {
        nextFlashChance = time + Math.PI - 0.1; // Wait until the next pass to check again
        
        // 1 in 100 chance
        if (Math.floor(Math.random() * 100) === 0) {
          flashState = true;
          flashStartTime = time;
          rOrb.classList.add('flash');
          echoes.forEach(echo => echo.classList.add('flash'));
        }
      }
      
      // If flashing, wait ~0.5 seconds before going back to continuing the rotation
      if (flashState && time > flashStartTime + 0.5) {
        flashState = false;
        rOrb.classList.remove('flash');
        echoes.forEach(echo => echo.classList.remove('flash'));
      }
      
      time += speed;
      requestAnimationFrame(animateOrb);
    }
    
    animateOrb();
  })();
</script>
